name: Continuous Deployment (CD)

on:
  push:
    branches: [ main, master ]
    # Chỉ chạy CD khi code ở backend hoặc frontend thay đổi
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/cd.yml'

# Cấp quyền ghi packages để push Docker image lên GitHub Container Registry (GHCR)
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Đăng nhập vào GitHub Container Registry (GHCR) dùng token có sẵn của repo
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        id: repo
        run: echo "NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # 1. Build & Push Backend Image
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.NAME }}-backend:latest
            ghcr.io/${{ steps.repo.outputs.NAME }}-backend:${{ github.sha }}

      # 2. Build & Push Frontend Image
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.NAME }}-frontend:latest
            ghcr.io/${{ steps.repo.outputs.NAME }}-frontend:${{ github.sha }}

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: [ build-and-push ]
    steps:
      - name: Simulate Production Deployment
        run: |
          echo "=========================================="
          echo "== CD Pipeline: Triggering Deployment   =="
          echo "=========================================="
          echo "Đang triển khai phiên bản commit: ${{ github.sha }}"
          echo "Tải images mới nhất từ GHCR..."
          echo "Restart containers với image mới..."
          echo "Deployment hoàn tất thành công!"
